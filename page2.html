<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無料犬猫イラスト素材</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

header{
background:white;
padding:20px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h1{
margin:0;
}

.search{
margin-top:15px;
}

.search input{
width:300px;
max-width:90%;
padding:10px;
font-size:16px;
}

.ad{
background:#fff3cd;
padding:20px;
margin:20px;
text-align:center;
border-radius:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
display:block;
}

.download{
display:block;
background:#4CAF50;
color:white;
text-align:center;
padding:12px;
text-decoration:none;
font-weight:bold;
}

.download:hover{
opacity:0.9;
}

footer{
background:white;
padding:20px;
text-align:center;
margin-top:20px;
}

</style>

</head>

<body>

<header>
<h1>無料犬猫イラスト素材</h1>
<p>ゲーム制作・動画編集などに使える犬猫フリー素材</p>

<div class="search">
<input type="text" id="search" placeholder="cat または dog で検索">
</div>
</header>

<div class="ad">

</div>

<div class="gallery" id="gallery"></div>
<div style="text-align:center; padding:20px;">
  <a href="page1.html">1</a>
  <a href="page2.html">2</a>
  <a href="page3.html">3</a>
  <a href="page4.html">4</a>
  <a href="page5.html">5</a>
</div>
<footer>
<p>
<a href="terms.html">利用規約</a> |
<a href="privacy.html">プライバシーポリシー</a> |
<a href="contact.html">お問い合わせ</a>
</p>

<p>© 2026 Animal Assets</p>
</footer>

<script>

const gallery = document.getElementById("gallery");

// 猫 1～50
for(let i=51;i<=100;i++)

gallery.innerHTML += `
<div class="card" data-type="cat">
<img src="images/cat${i}.png" alt="cat">
<a class="download"
href="images/cat${i}.png"
download>
ダウンロード
</a>
</div>
`;

}

// 犬 1～50
for(let i=51;i<=100;i++)

gallery.innerHTML += `
<div class="card" data-type="dog">
<img src="images/dog${i}.png" alt="dog">
<a class="download"
href="images/dog${i}.png"
download>
ダウンロード
</a>
</div>
`;

}

// 検索
const search=document.getElementById("search");

search.addEventListener("keyup",function(){

const value=search.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{

const type=card.dataset.type;

if(
value==="" ||
type.includes(value)
){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

</script>

</body>
</html>
