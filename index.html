<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無料動物イラスト素材</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

header{
background:white;
padding:20px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h1{
margin:0;
}

.search{
margin-top:15px;
}

.search input{
width:300px;
max-width:90%;
padding:10px;
font-size:16px;
}

.ad{
background:#fff3cd;
padding:20px;
margin:20px;
text-align:center;
border-radius:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
display:block;
}

.download{
display:block;
background:#4CAF50;
color:white;
text-align:center;
padding:12px;
text-decoration:none;
font-weight:bold;
}

.download:hover{
opacity:0.9;
}

footer{
background:white;
padding:20px;
text-align:center;
margin-top:20px;
}

</style>

</head>

<body>

<header>
<h1>無料動物イラスト素材</h1>
<p>ゲーム制作・動画編集などに使えるフリー素材</p>

<div class="search">
<input type="text" id="search" placeholder="検索">
</div>
</header>

<div class="ad">
Google AdSense設置予定エリア
</div>

<div class="gallery">

<div class="card">
<img src="images/cat1.png" alt="cat">
<a class="download" href="images/cat1.png" download>
ダウンロード
</a>
</div>

<div class="card">
<img src="images/cat2.png" alt="cat">
<a class="download" href="images/cat2.png" download>
ダウンロード
</a>
</div>

<div class="card">

</div>

<div class="card">

<div class="card">

</div>

<div class="card">

</a>
</div>

</div>

<footer>
© 2026 Animal Assets
</footer>

<script>

const search=document.getElementById("search");

search.addEventListener("keyup",function(){

const value=search.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{

const img=card.querySelector("img");
const text=(img.alt || "").toLowerCase();

if(text.includes(value)){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

</script>

</body>
</html>
