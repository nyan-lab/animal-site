<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無料動物イラスト素材</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#f7f7f7;
}

header{
background:white;
padding:20px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h1{
margin:0;
}

.search{
margin-top:15px;
}

.search input{
width:300px;
max-width:90%;
padding:10px;
}

.ad{
background:#fff4c2;
margin:20px;
padding:20px;
text-align:center;
border-radius:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.card img{
width:100%;
display:block;
}

.card h3{
padding:10px;
margin:0;
}

.download{
display:block;
text-align:center;
background:#4caf50;
color:white;
padding:10px;
text-decoration:none;
}

footer{
background:white;
padding:20px;
margin-top:20px;
text-align:center;
}
</style>

</head>

<body>

<header>
<h1>無料動物イラスト素材</h1>
<p>ゲーム制作・動画編集・配信に使えるフリー素材</p>

<div class="search">
<input type="text" id="search" placeholder="素材を検索">
</div>
</header>

<div class="ad">
Google AdSense設置予定エリア
</div>

<div class="gallery">

<div class="card">
<img src="images/cat1.png">
<h3>かわいい猫</h3>
<a class="download" href="images/cat1.png" download>
ダウンロード
</a>
</div>

<div class="card">
<img src="images/dog1.png">
<h3>かわいい犬</h3>
<a class="download" href="images/dog1.png" download>
ダウンロード
</a>
</div>

<div class="card">
<img src="images/fox1.png">
<h3>かわいいキツネ</h3>
<a class="download" href="images/fox1.png" download>
ダウンロード
</a>
</div>

</div>

<footer>
© 2026 Animal Assets
</footer>

<script>
const search=document.getElementById("search");

search.addEventListener("keyup",()=>{
const value=search.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{
card.style.display=
card.innerText.toLowerCase().includes(value)
? "block"
: "none";
});
});
</script>

</body>
</html>
