<script>

const gallery = document.getElementById("gallery");


// 猫 1〜50

for(let i=1;i<=50;i++){

gallery.innerHTML += `
<div class="card" data-type="cat">

<img
src="images/cat${i}.png"
alt="無料猫イラスト素材 ${i}">

<h2>猫イラスト No.${i}</h2>

<a
class="download"
href="images/cat${i}.png"
download>

ダウンロード

</a>

</div>
`;

}


// 犬 1〜50

for(let i=1;i<=50;i++){

gallery.innerHTML += `
<div class="card" data-type="dog">

<img
src="images/dog${i}.png"
alt="無料犬イラスト素材 ${i}">

<h2>犬イラスト No.${i}</h2>

<a
class="download"
href="images/dog${i}.png"
download>

ダウンロード

</a>

</div>
`;

}


// 検索

const search =
document.getElementById("search");

search.addEventListener("keyup",()=>{

const value =
search.value.toLowerCase();

document
.querySelectorAll(".card")
.forEach(card=>{

const type =
card.dataset.type;

if(
value==="" ||
type.includes(value)
){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

</script>
